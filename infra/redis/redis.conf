# Media Intelligence v2 — local Redis (dev)
# Same endpoint shape as live: redis://HOST:6379/0 (broker) and /1 (results)

bind 127.0.0.1
port 6379
protected-mode yes
timeout 0
tcp-keepalive 300

# Persist under infra/redis/data (created by start script)
dir ./data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000

appendonly no
loglevel notice
